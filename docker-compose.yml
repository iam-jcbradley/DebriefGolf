services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debrief}
      POSTGRES_DB: ${POSTGRES_DB:-debrief_golf}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debrief}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-debrief}:${POSTGRES_PASSWORD:-debrief}@db:5432/${POSTGRES_DB:-debrief_golf}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness (/health), deliberately not readiness (/ready) — a
      # container marked unhealthy gets restarted, and a Postgres blip
      # shouldn't trigger that for a process that's otherwise fine (Phase
      # 12's whole reason for splitting the two). No curl in this image, so
      # this shells out to Python instead of adding a package for one check.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  db_data:
