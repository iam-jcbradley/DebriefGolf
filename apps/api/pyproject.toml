[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "fitparse>=1.2.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pyright>=1.1.400",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", "alembic/versions"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
pythonVersion = "3.12"

# Phase 12 demoted these five rules to `warning` rather than fixing their
# ~101 SQLModel-stub-gap diagnostics on day one — narrowing the nullable-PK
# pattern and correcting geometry-column annotations were bigger, separately
# -justified changes than "add a CI type check." Phase 17 did that work and
# these are back at their normal `error` severity: 0 diagnostics under all
# five as of that phase, verified with `uv run pyright`. What's left when a
# genuine SQLModel/SQLAlchemy stub gap can't be resolved by a real type fix
# is a scoped `# type: ignore[the specific rule]` naming the gap inline,
# not a blanket suppression — see `app/core/orm_typing.py`'s `persisted()`
# (narrows a nullable PK at a call site where the row is known persisted)
# and `col()` (casts a SQLModel class attribute to `Any` at query-
# construction call sites — `.order_by()`, `.join()`, `.is_not()`, etc. —
# where pyright statically sees the column's plain Python type rather than
# the SQLAlchemy column-expression it actually is at the class level).
reportArgumentType = "error"
reportCallIssue = "error"
reportAttributeAccessIssue = "error"
reportOptionalMemberAccess = "error"
reportAssignmentType = "error"
