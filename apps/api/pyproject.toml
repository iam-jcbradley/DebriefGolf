[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "fitparse>=1.2.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
